name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build portfolio APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app for native
        run: npm run build:app

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --console=plain

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/mahmoud-mossad-portfolio.apk
          ls -lh release/mahmoud-mossad-portfolio.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahmoud-mossad-portfolio-apk
          path: release/mahmoud-mossad-portfolio.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Portfolio APK (latest)
          body: |
            Installable Android build of Mahmoud Mossad's portfolio.

            - Commit: `${{ github.sha }}`
            - Built by GitHub Actions
            - Direct download: `mahmoud-mossad-portfolio.apk`
          files: release/mahmoud-mossad-portfolio.apk
          make_latest: true
          overwrite_files: true

      - name: Job summary
        run: |
          {
            echo "## APK ready"
            echo ""
            echo "Download: https://github.com/${{ github.repository }}/releases/latest/download/mahmoud-mossad-portfolio.apk"
            echo ""
            echo "Artifact: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
